<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="blueNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B6EE1"/>
      <stop offset="100%" stop-color="#9B6EFF"/>
    </linearGradient>

    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <linearGradient id="volcanoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#5D2E0C"/>
    </linearGradient>
  </defs>

  <!-- V outline -->
  <path d="M50 8 L85 85 L50 85 Z" fill="none" stroke="url(#blueNeon)" stroke-width="3" filter="url(#glow)"/>
  <path d="M50 8 L15 85 L50 85 Z" fill="none" stroke="url(#blueNeon)" stroke-width="3" filter="url(#glow)"/>

  <!-- Volcano mountain -->
  <path d="M25 80 L40 45 L50 55 L60 45 L75 80 Z" fill="url(#volcanoGrad)"/>

  <!-- Crater -->
  <ellipse cx="50" cy="48" rx="12" ry="4" fill="#2a1508"/>

  <!-- Lava eruption -->
  <path d="M42 48 Q38 25 50 12 Q62 25 58 48" fill="url(#fireGrad)" filter="url(#glow)"/>

  <!-- Bright center -->
  <circle cx="50" cy="28" r="7" fill="#FFD700" filter="url(#glow)"/>

  <!-- Sparks -->
  <circle cx="35" cy="20" r="3" fill="#FF6B00" filter="url(#glow)"/>
  <circle cx="65" cy="18" r="2.5" fill="#FFD700" filter="url(#glow)"/>
  <circle cx="50" cy="10" r="2" fill="#FF4500" filter="url(#glow)"/>
  <circle cx="42" cy="15" r="2" fill="#FFA500" filter="url(#glow)"/>
</svg>