<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <filter id="pinkNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feFlood flood-color="#FF1493" flood-opacity="0.6"/>
      <feComposite in2="blur2" operator="in" result="glow2"/>
      <feFlood flood-color="#FF69B4" flood-opacity="0.4"/>
      <feComposite in2="blur1" operator="in" result="glow1"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blueNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feFlood flood-color="#8A2BE2" flood-opacity="0.5"/>
      <feComposite in2="blur2" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- VOLCANO text with double stroke neon effect -->
  <g filter="url(#pinkNeon)">
    <!-- Outer stroke -->
    <text x="200" y="60" text-anchor="middle"
          font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif"
          font-size="58" font-weight="bold" font-style="italic"
          fill="none" stroke="#FF1493" stroke-width="4"
          letter-spacing="2">VOLCANO</text>
    <!-- Inner stroke -->
    <text x="200" y="60" text-anchor="middle"
          font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif"
          font-size="58" font-weight="bold" font-style="italic"
          fill="none" stroke="#FFB6C1" stroke-width="1.5"
          letter-spacing="2">VOLCANO</text>
  </g>

  <!-- NIGHT CLUB text -->
  <g filter="url(#blueNeon)">
    <text x="200" y="100" text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="24" font-weight="bold"
          fill="none" stroke="#9370DB" stroke-width="2"
          letter-spacing="8">NIGHT CLUB</text>
    <text x="200" y="100" text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="24" font-weight="bold"
          fill="none" stroke="#DDA0DD" stroke-width="0.8"
          letter-spacing="8">NIGHT CLUB</text>
  </g>
</svg>